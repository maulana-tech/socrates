server {
    server_name sigap.lumbungstack.dev;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        gzip off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/acy.lumbungstack.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/acy.lumbungstack.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = sigap.lumbungstack.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name sigap.lumbungstack.dev;
    return 404; # managed by Certbot
}
