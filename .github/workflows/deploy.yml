name: CI and deploy EC2

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel a deployment while SSM is still changing the server.
concurrency:
  group: sigap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run lint
      - run: node scripts/check-agent-output.mjs
      - run: npm run build -- --webpack
      - name: Python self-checks
        working-directory: sigap/agent
        env:
          SIGAP_ENV: dev
          SIGAP_DB: /tmp/sigap-ci.db
        run: python manage.py check
      - run: python3 ops/test_deploy.py
      - name: Package release (tracked backend files only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p release/standalone
          cp -a .next/standalone/. release/standalone/
          cp -a public release/standalone/
          cp -a .next/static release/standalone/.next/
          git archive HEAD sigap | tar -x -C release
          cp ops/deploy.sh release/deploy.sh
          tar -czf release.tar.gz -C release .
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: release
          path: release.tar.gz
          retention-days: 7

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          for key in AWS_REGION AWS_ROLE_ARN DEPLOY_BUCKET EC2_INSTANCE_ID; do
            test -n "${!key}" || { echo "Missing GitHub variable: $key"; exit 1; }
          done
      - uses: actions/download-artifact@v4
        with:
          name: release
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Upload and deploy through SSM
        run: |
          set -euo pipefail
          export RELEASE_URI="s3://$DEPLOY_BUCKET/releases/$RELEASE_ID.tar.gz"
          export RELEASE_SHA256="$(sha256sum release.tar.gz | cut -d ' ' -f1)"
          aws s3 cp release.tar.gz "$RELEASE_URI" --only-show-errors
          python3 - <<'PY'
          import json, os, shlex
          q = shlex.quote
          command = "\n".join([
              "set -eu",
              "work=$(mktemp -d)",
              "trap 'rm -rf \"$work\"' EXIT",
              f'aws s3 cp {q(os.environ["RELEASE_URI"])} "$work/release.tar.gz" --region {q(os.environ["AWS_REGION"])} --only-show-errors',
              f'echo {q(os.environ["RELEASE_SHA256"] + "  ")}"$work/release.tar.gz" | sha256sum -c -',
              'tar -xzf "$work/release.tar.gz" -C "$work" ./deploy.sh',
              f'bash "$work/deploy.sh" "$work/release.tar.gz" {q(os.environ["RELEASE_ID"])}',
          ])
          with open("ssm-parameters.json", "w") as f:
              json.dump({"commands": [command], "executionTimeout": ["1200"]}, f)
          PY
          command_id=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://ssm-parameters.json \
            --timeout-seconds 120 \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $command_id"
          # The standard AWS waiter ends too early for dependency installation.
          for attempt in $(seq 1 132); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || true)
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
          test "$status" = Success
